name: CI

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  build-template:
    name: Scaffold and build the template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('templates/default/package.json','utf8'))"

      # `repository` is what the registry validates the signed provenance statement
      # against when the release workflow publishes. Without it the upload is rejected
      # with E422 *after* signing, which is a confusing place to discover a typo.
      - name: Check package metadata required for publishing
        run: |
          node -e "
            const p = require('./package.json');
            const want = 'github.com/zio/create-zio-website';
            if (!p.repository || !String(p.repository.url).includes(want))
              throw new Error('package.json repository.url must reference ' + want);
            if (typeof p.bin !== 'object')
              throw new Error('package.json bin must be an object, so npm does not have to infer the binary name');
          "

      # The template is the product. Build a site out of it the way `sbt installWebsite`
      # does -- substitute the placeholders, add the docs directory mdoc would populate,
      # then install and build. A template that cannot build is the failure mode that
      # went unnoticed for three years while it sat on Docusaurus 2.
      - name: Materialize the template
        run: |
          mkdir -p /tmp/site
          cp -a templates/default/. /tmp/site/
          cd /tmp/site
          sed -i 's/{{lower name}}/ci-test-site/g; s/{{name}}/CI Test Site/g' package.json docusaurus.config.js
          mkdir -p docs
          printf -- '---\ntitle: CI Test Site\n---\n\n# CI Test Site\n\nBuilt from the template during CI.\n' > docs/index.md
          printf 'module.exports = {sidebar: [{type: "autogenerated", dirName: "."}]};\n' > docs/sidebars.js

      - name: Install
        working-directory: /tmp/site
        run: npm install

      - name: Build
        working-directory: /tmp/site
        run: npm run build

      - name: Confirm the site actually rendered
        working-directory: /tmp/site
        run: test -f build/index.html || (echo "no build/index.html produced" && exit 1)
