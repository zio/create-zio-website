name: Release

on:
  release:
    types: created

# Trusted publishing authenticates with a short-lived OIDC token minted by GitHub
# for this workflow, instead of a long-lived npm token held as a secret.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node 24 ships npm 11.x, which is what understands the OIDC exchange.
      #
      # `registry-url` is deliberately not set. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and with no
      # NODE_AUTH_TOKEN that expands to an empty token. npm then tries classic auth with
      # an empty credential and fails with ENEEDAUTH instead of falling back to OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: npm publish
        run: |
          npm version --no-git-tag-version "$(git describe --tags --abbrev=0)"
          npm publish --access public
